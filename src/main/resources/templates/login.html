<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('VolunTrack - Sign In')}">
    <meta charset="UTF-8">
    <title>VolunTrack - Sign In</title>
</head>
<body>

    <header th:replace="~{fragments/nav :: nav}"></header>

    <main class="container" style="max-width: 480px; padding-top: 4rem; padding-bottom: 4rem;">
        <div class="card">
            <h2 class="card-title" style="text-align: center; margin-bottom: 1.5rem;">Sign In to VolunTrack</h2>
            
            <div id="error-alert" class="alert alert-danger" style="display: none;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required />
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
                Don't have an account? <a th:href="@{/register.html}" style="color: var(--primary); font-weight: 600;">Register here</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById("error-alert");
            alertBox.style.display = "none";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const data = await apiFetch("/auth/login", {
                    method: "POST",
                    body: JSON.stringify({ email, password })
                });

                localStorage.setItem("token", data.token);
                localStorage.setItem("user", JSON.stringify({
                    id: data.userId,
                    name: data.name,
                    email: data.email,
                    role: data.role
                }));

                redirectUserToRoleDashboard(data.role);
            } catch (err) {
                alertBox.innerText = err.message;
                alertBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
