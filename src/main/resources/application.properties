# ==========================================================================
# VolunTrack Application Properties
# ==========================================================================

spring.application.name=VolunTrack
server.port=${PORT:8080}

# --------------------------------------------------------------------------
# Database Configuration
# DEFAULT: H2 In-Memory Database (Zero-config instant startup out of the box)
# --------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:voluntrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=anand
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --------------------------------------------------------------------------
# MySQL Database Configuration Options
# To use MySQL: Uncomment the 4 lines below and set your MySQL password
# --------------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/voluntrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD_HERE
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --------------------------------------------------------------------------
# JPA / Hibernate Configuration
# DDL Auto set to 'update' so database tables are auto-generated from JPA Entities
# --------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# --------------------------------------------------------------------------
# Static Resource Serving (Frontend HTML/CSS/JS served directly from static/)
# --------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/

# --------------------------------------------------------------------------
# JWT Security Secret Configuration
# --------------------------------------------------------------------------
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000
